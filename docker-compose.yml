services:
  nodepower:
    build: .
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      PUBLIC_BASE_URL: "http://localhost:8787"
      DATA_DIR: "/app/data"
      MIMO_BASE_URL: "https://token-plan-cn.xiaomimimo.com/v1"
      MIMO_MODEL: "mimo-v2.5"
      # MIMO_API_KEY: "replace-with-your-key"
    volumes:
      - nodepower-data:/app/data

volumes:
  nodepower-data:
